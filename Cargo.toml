[workspace]
resolver = "2"
members = ["hew-core", "hew"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/droidnoob/hew"
homepage = "https://github.com/droidnoob/hew"
description = "Carve code, not chaos — Beads-powered methodology for AI coding agents."
authors = ["Hew contributors"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2.0"
inquire = "0.9"
indicatif = "0.18"
anstream = "1.0"
anstyle = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "8.0"
etcetera = "0.11"
ctrlc = "3.5"
wait-timeout = "0.2"
axoupdater = { version = "0.10", features = ["blocking"] }
schemars = "1.2"
vergen = { version = "9.1", features = ["build", "cargo", "rustc"] }

# dev
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
insta = { version = "1.47", features = ["json"] }
trycmd = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "droidnoob/homebrew-hew"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
