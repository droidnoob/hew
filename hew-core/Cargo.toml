[package]
name = "hew-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for hew — Beads-powered methodology for AI coding agents."

[dependencies]
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
which = { workspace = true }
etcetera = { workspace = true }
wait-timeout = { workspace = true }
tracing = { workspace = true }
toml = "0.9"

# Optional tree-sitter stack — pulled in by the `treesitter` feature.
# Default builds compile zero tree-sitter crates so the existing 4-way CI
# matrix and cold-build budget stay untouched. Runtime pinned per
# DECISION:treesitter-abi-pinning; grammars float at minor version.
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
streaming-iterator = { workspace = true, optional = true }

[features]
default = []
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:streaming-iterator",
]

[lib]
name = "hew_core"
path = "src/lib.rs"

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }

[[example]]
name = "treesitter_scan"
required-features = ["treesitter"]
